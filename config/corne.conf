# Recovery firmware: keep only matrix scanning, USB HID and the split radio.
# OLED, RGB, external VCC control and deep sleep are deliberately disabled so
# a shorted or overloaded peripheral rail cannot prevent USB enumeration.

CONFIG_ZMK_KEYBOARD_NAME="CRKBD-RESCUE"
CONFIG_ZMK_USB=y

CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n
CONFIG_ZMK_EXT_POWER=n
CONFIG_ZMK_SLEEP=n
