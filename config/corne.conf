# Identity
CONFIG_ZMK_KEYBOARD_NAME="crkbd"

# RGB: available from the Adjust layer, but off whenever USB is disconnected.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
# Keep RGB control separate from the shared OLED/external-power rail.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=25

# OLED: the Corne shield in ZMK v0.3.0 supplies the SSD1306 devicetree data.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Battery operation: sleep after 15 minutes and use the standard radio power.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Keep the existing explicit VCC control available from the Adjust layer.
CONFIG_ZMK_EXT_POWER=y
